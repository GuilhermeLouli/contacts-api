services:
  mysql:
    image: mysql:8.4
    container_name: contacts-db

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: contacts_db

    ports:
      - "3306:3306"

    volumes:
      - mysql-data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql

volumes:
  mysql-data: